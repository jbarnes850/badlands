[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badlands"
version = "0.1.0"
description = "Active-network cyber self-play environment substrate"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jarrod Barnes" }]
keywords = ["cyber", "self-play", "evaluation", "autonomous-cyber-defence", "llm"]
dependencies = [
    "jsonschema>=4.0",
    "openai-agents>=0.15.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
badlands-episode = "badlands.cli:main"
badlands-replay = "badlands.scoring.replay:main"
badlands-live-validate = "badlands.live_validate:main"
badlands-validity = "badlands.validity_experiments:main"
badlands-agents-sdk-campaign = "badlands.campaigns.agents_sdk_smoke:main"
badlands-campaign-run = "badlands.campaigns.continuous:main"

[tool.setuptools.packages.find]
include = ["badlands*"]

[tool.setuptools.package-data]
badlands = ["schemas/*.json", "datasets/*.csv", "datasets/*.md", "scenarios/*.json", "calibration/*.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
